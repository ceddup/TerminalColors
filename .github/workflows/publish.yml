name: Publish

# Publication to the PowerShell Gallery.
#
# Triggered when a GitHub release is published: the release is what counts, not a
# push. The tag must be v<ModuleVersion> - the job checks this and fails if the
# manifest and the tag diverge, so a version that does not match what is tagged is
# never published.
#
# Prerequisite: the PSGALLERY_API_KEY secret in the repository secrets.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulate only (-WhatIf), publish nothing
        type: boolean
        default: true

jobs:
  publish:
    name: PowerShell Gallery
    runs-on: windows-latest
    environment: powershell-gallery

    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the manifest
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile .\src\TerminalColors\TerminalColors.psd1
          $version = $manifest.ModuleVersion
          $tag = '${{ github.event.release.tag_name }}' -replace '^v', ''
          Write-Host "manifest = $version / tag = $tag"
          if ($version -ne $tag) {
              throw "The tag [$tag] does not match ModuleVersion [$version]."
          }

      - name: Refuse an already published version
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile .\src\TerminalColors\TerminalColors.psd1
          $version = $manifest.ModuleVersion
          $found = Find-Module TerminalColors -RequiredVersion $version -ErrorAction SilentlyContinue
          if ($found) {
              throw "Version $version is already on the Gallery. Bump ModuleVersion."
          }
          Write-Host "Version $version is available."

      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Invoke-Tests.ps1

      - name: Tests (PowerShell 7)
        shell: pwsh
        run: .\tests\Invoke-Tests.ps1

      - name: Static analysis
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $found = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($found) { $found | Format-Table -AutoSize | Out-String | Write-Host; throw "$($found.Count) problem(s)." }

      - name: Dry run
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is missing.' }
          Publish-Module -Path .\src\TerminalColors -NuGetApiKey $env:PSGALLERY_API_KEY -WhatIf -Verbose

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Module -Path .\src\TerminalColors -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose

      - name: Summary
        if: success()
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile .\src\TerminalColors\TerminalColors.psd1).ModuleVersion
          $published = '${{ github.event_name }}' -eq 'release' -or '${{ inputs.dry_run }}' -eq 'false'
          $state = if ($published) { 'published' } else { 'dry run only' }
          "## TerminalColors $version - $state" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($published) {
              "https://www.powershellgallery.com/packages/TerminalColors/$version" | Out-File $env:GITHUB_STEP_SUMMARY -Append
              '' | Out-File $env:GITHUB_STEP_SUMMARY -Append
              'The Gallery takes a few minutes to index the page.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

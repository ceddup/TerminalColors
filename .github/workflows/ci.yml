name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The module must work on both PowerShell editions: Windows PowerShell 5.1
        # is the one behind Windows Terminal's default profile.
        shell: [powershell, pwsh]

    # The edition is selected here rather than on each step: GitHub refuses the
    # matrix context on a step's shell: ("Unrecognized named-value: 'matrix'"),
    # which rejects the whole file at parse time, before it can even read the
    # workflow name. It does accept it on a job's defaults.
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7

      - name: PowerShell version
        run: $PSVersionTable | Format-List

      - name: Validate the manifest
        run: Test-ModuleManifest -Path .\src\TerminalColors\TerminalColors.psd1 | Format-List Name, Version, PowerShellVersion

      - name: Tests
        run: .\tests\Invoke-Tests.ps1

  analysis:
    name: Static analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyse
        shell: pwsh
        run: |
          # The exclusions and their justification live in the settings file.
          $found = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          if ($found) {
              $found | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200 | Write-Host
              throw "$($found.Count) problem(s) found."
          }
          Write-Host 'Static analysis clean.'

  shellcheck:
    name: bash variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax
        run: bash -n shell/terminalcolors.sh

      - name: Resolution and automatic-colour parity
        run: |
          set -e
          source shell/terminalcolors.sh
          # Reference values produced by the PowerShell module.
          expected_oseille='#15C115'
          expected_tc='#B0DC2E'
          actual_oseille=$(_tc_auto_color oseille)
          actual_tc=$(_tc_auto_color TerminalColors)
          echo "oseille        expected=$expected_oseille got=$actual_oseille"
          echo "TerminalColors expected=$expected_tc got=$actual_tc"
          [ "$actual_oseille" = "$expected_oseille" ]
          [ "$actual_tc" = "$expected_tc" ]

          [ "$(_tc_name_to_hex Burgundy)" = '#FF6347' ]
          [ "$(_tc_blend '#0C0C0C' '#61DAFB' 0.30)" = '#264A54' ]

          mkdir -p /tmp/p/.vscode /tmp/s/.vs/Sol
          echo '{ "color": "#215732", "name": "Project" }' > /tmp/p/.terminalcolors.json
          echo 'master:Teal' > /tmp/s/.vs/Sol/color.txt
          mkdir -p /tmp/p/sub/folder
          [ "$(_tc_resolve /tmp/p/sub/folder)" = '#215732|Project|Config' ]
          [ "$(_tc_resolve /tmp/s)" = '#008080|Sol|SolutionColors' ]
          echo 'bash variant conforms.'
